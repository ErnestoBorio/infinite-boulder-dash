<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infinite Boulder Dash</title>
  <meta name="description" content="Infinite procedural cave exploration Boulder Dash mod with permadeath roguelike mechanics and dynamic 16-color retro palettes.">
  <link rel="stylesheet" href="css/boulderdash.css">
</head>
<body>

  <!-- Fullscreen Rendering Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Floating Milestone & Event Message Sign (Positioned dynamically below Rockford) -->
  <div id="message-banner"></div>

  <!-- Center HUD Title Link -->
  <a id="hud-title-link" href="https://drean64.itch.io/infinite-boulder-dash" target="_blank" rel="noopener noreferrer" title="Play Infinite Boulder Dash on itch.io" aria-label="Infinite Boulder Dash on itch.io">
    <img id="hud-title-img" src="images/infinite-boulder-dash.png" alt="Infinite Boulder Dash" onerror="if (this.src.indexOf('infinite-boulder-dash.png') !== -1 && !this._tried) { this._tried = true; this.src = 'infinite-boulder-dash.png'; }" />
  </a>

  <!-- Floating Top Controls Toolbar -->
  <div class="top-toolbar">
    <button id="btn-sound" class="btn" title="Toggle Sound (M)">SOUND: ON</button>
    <button id="btn-new-world" class="btn" title="Generate New World Seed">NEW WORLD</button>
    <a id="btn-github" class="btn btn-github" href="https://github.com/ErnestoBorio/infinite-boulder-dash" target="_blank" rel="noopener noreferrer" title="View Source on GitHub" aria-label="GitHub Repository">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>GITHUB</span>
    </a>
  </div>

  <!-- Roguelike Game Over Modal -->
  <div id="death-modal" class="modal-overlay">
    <div class="death-card">
      <div class="death-title">CRUSHED!</div>
      <div class="death-subtitle">Rockford perished in the deep infinite caverns</div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Diamonds</div>
          <div id="death-diamonds" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Final Score</div>
          <div id="death-score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Max Depth</div>
          <div id="death-depth" class="stat-value">0m</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Time Survived</div>
          <div id="death-time" class="stat-value">0s</div>
        </div>
      </div>

      <div class="best-records">
        <div>Best Score: <strong id="best-score" style="color:var(--retro-yellow)">0</strong></div>
        <div>Best Depth: <strong id="best-depth" style="color:var(--retro-skyblue)">0m</strong></div>
      </div>

      <button id="btn-modal-retry" class="btn-new-run">NEW EXPEDITION</button>
      <div class="seed-note">Each death generates a completely new procedural world!</div>
    </div>
  </div>

  <!-- Bottom Controls & Touch Overlay -->
  <footer class="bottom-overlay">
    <!-- Desktop Controls Hint -->
    <div class="controls-hint">
      <span><strong>MOVE</strong>: <span class="key-tag">Arrows</span> / <span class="key-tag">WASD</span></span>
      <span><strong>GRAB IN PLACE</strong>: <span class="key-tag">Space</span> + <span class="key-tag">Direction</span></span>
      <span><strong>MUTE</strong>: <span class="key-tag">M</span></span>
      <span><strong>RESTART</strong>: <span class="key-tag">R</span></span>
    </div>

    <!-- Mobile / Touch Controls -->
    <div class="touch-controls">
      <div class="dpad">
        <div></div>
        <button class="dpad-btn" data-dir="ArrowUp" aria-label="Up">▲</button>
        <div></div>
        <button class="dpad-btn" data-dir="ArrowLeft" aria-label="Left">◀</button>
        <div></div>
        <button class="dpad-btn" data-dir="ArrowRight" aria-label="Right">▶</button>
        <div></div>
        <button class="dpad-btn" data-dir="ArrowDown" aria-label="Down">▼</button>
        <div></div>
      </div>

      <div class="action-pad">
        <button id="touch-grab" class="action-btn" aria-label="Grab in place">GRAB</button>
      </div>
    </div>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
